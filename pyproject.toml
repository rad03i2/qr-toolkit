[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radwan-qr-toolkit"
version = "1.0.0"
description = "Local-first QR code generation and decoding toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Radwan Abdulhadi Ahmed" }]
dependencies = [
  "qrcode[pil]>=7.4,<9",
  "opencv-python-headless>=4.8,<5",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
qr-toolkit = "qr_toolkit.cli:main"

[project.urls]
Repository = "https://github.com/rad03i2/qr-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
